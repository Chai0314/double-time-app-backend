<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>双人时光 - 我们的行程</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body { background-color: #FFF0F0; font-family: 'Nunito', sans-serif; }
        .mobile-container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            margin: 0 auto;
            background: #FFF0F0;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 80px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border-radius: 12px;
        }
        .active-day {
            background-color: #FF8C9E;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 140, 158, 0.3);
        }
        .has-event::after {
            content: '';
            width: 4px;
            height: 4px;
            background-color: #FF8C9E;
            border-radius: 50%;
            margin-top: 2px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
        }
        .modal.active {
            display: flex;
        }
    </style>
</head>
<body>
<div class="mobile-container">
<!-- 顶部导航 -->
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md px-6 py-4 flex justify-between items-center shadow-sm">
<h1 class="text-xl font-bold text-gray-800">我们的行程</h1>
<button class="w-10 h-10 bg-[#FF8C9E] text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform" onclick="toggleModal(true)">
<iconify-icon icon="solar:add-circle-bold" width="24"></iconify-icon>
</button>
</header>
<!-- 视图切换 -->
<div class="px-6 mt-4">
<div class="bg-white p-1 rounded-2xl flex text-sm shadow-sm">
<button class="flex-1 py-2 rounded-xl bg-[#FF8C9E] text-white font-bold">月视图</button>
<button class="flex-1 py-2 rounded-xl text-gray-400">周视图</button>
<button class="flex-1 py-2 rounded-xl text-gray-400">日视图</button>
</div>
</div>
<!-- 日历展示 -->
<section class="px-6 mt-6">
<div class="bg-white p-4 rounded-3xl shadow-sm">
<div class="flex justify-between items-center mb-4 px-2">
<span class="font-bold text-gray-700">2026年 6月</span>
<div class="flex space-x-4 text-gray-400">
<iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon>
<iconify-icon icon="solar:alt-arrow-right-bold"></iconify-icon>
</div>
</div>
<div class="calendar-grid text-gray-400 text-[10px] mb-2 text-center">
<div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
</div>
<div class="calendar-grid">
<!-- 模拟日历 -->
<div class="calendar-day text-gray-300">31</div>
<div class="calendar-day text-gray-700">1</div>
<div class="calendar-day text-gray-700">2</div>
<div class="calendar-day text-gray-700 has-event">3</div>
<div class="calendar-day text-gray-700">4</div>
<div class="calendar-day text-gray-700">5</div>
<div class="calendar-day text-gray-700">6</div>
<div class="calendar-day text-gray-700">7</div>
<div class="calendar-day text-gray-700">8</div>
<div class="calendar-day text-gray-700 has-event">9</div>
<div class="calendar-day text-gray-700">10</div>
<div class="calendar-day text-gray-700">11</div>
<div class="calendar-day text-gray-700">12</div>
<div class="calendar-day text-gray-700">13</div>
<div class="calendar-day text-gray-700">14</div>
<div class="calendar-day text-gray-700">15</div>
<div class="calendar-day text-gray-700">16</div>
<div class="calendar-day text-gray-700">17</div>
<div class="calendar-day text-gray-700">18</div>
<div class="calendar-day text-gray-700">19</div>
<div class="calendar-day text-gray-700">20</div>
<div class="calendar-day text-gray-700">21</div>
<div class="calendar-day text-gray-700">22</div>
<div class="calendar-day text-gray-700">23</div>
<div class="calendar-day text-gray-700">24</div>
<div class="calendar-day text-gray-700">25</div>
<div class="calendar-day active-day font-bold">26</div>
<div class="calendar-day text-gray-700">27</div>
<div class="calendar-day text-gray-700">28</div>
<div class="calendar-day text-gray-700">29</div>
<div class="calendar-day text-gray-700">30</div>
<div class="calendar-day text-gray-300">1</div>
<div class="calendar-day text-gray-300">2</div>
<div class="calendar-day text-gray-300">3</div>
<div class="calendar-day text-gray-300">4</div>
</div>
</div>
</section>
<!-- 行程列表 -->
<section class="px-6 mt-6 space-y-4">
<h3 class="font-bold text-gray-800">今日行程 (3)</h3>
<!-- 行程 1 -->
<div class="bg-white p-4 rounded-3xl shadow-sm flex items-start space-x-4">
<div class="w-12 h-12 bg-pink-50 rounded-2xl flex items-center justify-center text-[#FF8C9E] flex-shrink-0">
<iconify-icon icon="solar:cup-hot-bold-duotone" width="28"></iconify-icon>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h4 class="font-bold text-gray-800">午餐约会</h4>
<span class="text-[10px] bg-green-50 text-green-500 px-2 py-0.5 rounded-full">进行中</span>
</div>
<p class="text-xs text-gray-400 mt-1">12:00 - 13:30 · 某某意式餐厅</p>
<div class="flex justify-between items-center mt-3">
<div class="flex -space-x-2">
<img alt="User" class="w-6 h-6 rounded-full border-2 border-white" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/ed2855dd1b20418ea15bb2ca0beac9ce.jpg"/>
<img alt="Partner" class="w-6 h-6 rounded-full border-2 border-white" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/91aeef1b9dde4c35a234020489dc0f9a.jpg"/>
</div>
<span class="text-xs font-bold text-[#FF8C9E]">￥280.00</span>
</div>
</div>
</div>
<!-- 行程 2 -->
<div class="bg-white p-4 rounded-3xl shadow-sm flex items-start space-x-4 opacity-70">
<div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center text-gray-400 flex-shrink-0">
<iconify-icon icon="solar:clapperboard-edit-bold-duotone" width="28"></iconify-icon>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h4 class="font-bold text-gray-800">看电影</h4>
<span class="text-[10px] bg-gray-100 text-gray-400 px-2 py-0.5 rounded-full">待开始</span>
</div>
<p class="text-xs text-gray-400 mt-1">15:30 - 17:30 · 万达影城</p>
</div>
</div>
<!-- 行程 3 -->
<div class="bg-white p-4 rounded-3xl shadow-sm flex items-start space-x-4">
<div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-400 flex-shrink-0">
<iconify-icon icon="solar:walking-bold-duotone" width="28"></iconify-icon>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h4 class="font-bold text-gray-800">晚间散步</h4>
<span class="text-[10px] bg-gray-100 text-gray-400 px-2 py-0.5 rounded-full">待开始</span>
</div>
<p class="text-xs text-gray-400 mt-1">19:00 - 20:00 · 奥森公园</p>
</div>
</div>
</section>
<!-- 新建行程弹窗 -->
<div class="modal items-center justify-center px-6" id="addModal">
<div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="toggleModal(false)"></div>
<div class="relative w-full bg-white rounded-[32px] p-6 shadow-2xl animate-in slide-in-from-bottom duration-300">
<div class="flex justify-between items-center mb-6">
<h3 class="text-lg font-bold text-gray-800">新建行程</h3>
<button class="text-gray-400" onclick="toggleModal(false)"><iconify-icon icon="solar:close-circle-bold" width="24"></iconify-icon></button>
</div>
<div class="space-y-4">
<div>
<label class="text-xs text-gray-400 ml-1">行程标题</label>
<input class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm mt-1 focus:ring-2 focus:ring-[#FF8C9E]" placeholder="想去做什么？" type="text"/>
</div>
<div class="grid grid-cols-3 gap-2">
<button class="flex flex-col items-center p-2 rounded-2xl border-2 border-[#FF8C9E] bg-pink-50">
<iconify-icon class="text-[#FF8C9E]" icon="solar:cup-hot-bold-duotone"></iconify-icon>
<span class="text-[10px] mt-1 text-[#FF8C9E]">约会</span>
</button>
<button class="flex flex-col items-center p-2 rounded-2xl border-2 border-transparent bg-gray-50">
<iconify-icon class="text-gray-400" icon="solar:clapperboard-edit-bold-duotone"></iconify-icon>
<span class="text-[10px] mt-1 text-gray-400">娱乐</span>
</button>
<button class="flex flex-col items-center p-2 rounded-2xl border-2 border-transparent bg-gray-50">
<iconify-icon class="text-gray-400" icon="solar:home-2-bold-duotone"></iconify-icon>
<span class="text-[10px] mt-1 text-gray-400">居家</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="text-xs text-gray-400 ml-1">日期</label>
<input class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm mt-1" type="date" value="2026-06-26"/>
</div>
<div>
<label class="text-xs text-gray-400 ml-1">时间</label>
<input class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm mt-1" type="time" value="12:00"/>
</div>
</div>
<div>
<label class="text-xs text-gray-400 ml-1">地点</label>
<input class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm mt-1" placeholder="在哪里？" type="text"/>
</div>
</div>
<button class="w-full bg-[#FF8C9E] text-white font-bold py-4 rounded-2xl mt-8 shadow-lg shadow-pink-200" onclick="toggleModal(false)">保存行程</button>
</div>
</div>
<!-- 底部导航栏 -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[414px] bg-white border-t border-gray-100 px-6 py-3 flex justify-between items-center z-50">
<a class="flex flex-col items-center text-gray-400" href="home.html">
<iconify-icon icon="solar:home-smile-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">首页</span>
</a>
<a class="flex flex-col items-center text-[#FF8C9E]" href="schedule.html">
<iconify-icon icon="solar:calendar-minimalistic-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1 font-bold">行程</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="todo.html">
<iconify-icon icon="solar:checklist-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">ToDo</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="album.html">
<iconify-icon icon="solar:gallery-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">相册</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="profile.html">
<iconify-icon icon="solar:user-circle-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">我的</span>
</a>
</nav>
</div>
<script>
        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if (show) {
                modal.classList.add('active');
            } else {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
