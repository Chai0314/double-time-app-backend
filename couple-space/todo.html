<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>双人时光 - 待办清单</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body { background-color: #FFF0F0; font-family: 'Nunito', sans-serif; }
        .mobile-container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            margin: 0 auto;
            background: #FFF0F0;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 100px;
        }
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
<div class="mobile-container">
<!-- 顶部统计 -->
<header class="bg-white px-6 py-6 rounded-b-[40px] shadow-sm">
<h1 class="text-xl font-bold text-gray-800 mb-4">我们的待办清单</h1>
<div class="grid grid-cols-3 gap-3">
<div class="bg-blue-50 p-3 rounded-2xl text-center">
<p class="text-[10px] text-blue-400">他负责</p>
<p class="text-lg font-bold text-blue-600">3</p>
</div>
<div class="bg-pink-50 p-3 rounded-2xl text-center">
<p class="text-[10px] text-[#FF8C9E]">她负责</p>
<p class="text-lg font-bold text-[#FF8C9E]">5</p>
</div>
<div class="bg-orange-50 p-3 rounded-2xl text-center">
<p class="text-[10px] text-orange-400">共同</p>
<p class="text-lg font-bold text-orange-600">2</p>
</div>
</div>
</header>
<!-- 筛选标签 -->
<div class="px-6 mt-6 flex space-x-2 overflow-x-auto pb-2 no-scrollbar">
<button class="px-4 py-2 bg-[#FF8C9E] text-white rounded-full text-xs font-bold whitespace-nowrap">全部</button>
<button class="px-4 py-2 bg-white text-gray-400 rounded-full text-xs whitespace-nowrap">我的</button>
<button class="px-4 py-2 bg-white text-gray-400 rounded-full text-xs whitespace-nowrap">伴侣的</button>
<button class="px-4 py-2 bg-white text-gray-400 rounded-full text-xs whitespace-nowrap">共同的</button>
</div>
<!-- 任务列表 -->
<section class="px-6 mt-4 space-y-4">
<!-- 逾期任务 -->
<div class="task-card bg-white p-4 rounded-3xl shadow-sm border-l-4 border-red-400 relative overflow-hidden">
<div class="flex items-start space-x-3">
<button class="mt-1 w-5 h-5 border-2 border-red-200 rounded-md flex items-center justify-center">
<div class="w-3 h-3 bg-red-400 rounded-sm hidden"></div>
</button>
<div class="flex-1">
<div class="flex justify-between items-center">
<h4 class="font-bold text-gray-800">给阳台花浇水</h4>
<span class="text-[10px] text-red-400 font-bold bg-red-50 px-2 py-0.5 rounded-full">逾期2天</span>
</div>
<div class="flex items-center mt-2 text-[10px] text-gray-400 space-x-3">
<span class="flex items-center"><iconify-icon class="mr-1" icon="solar:alarm-bold"></iconify-icon> 06-24 10:00</span>
<span class="flex items-center"><iconify-icon class="mr-1 text-orange-300" icon="solar:tag-bold"></iconify-icon> 家务</span>
</div>
</div>
<img alt="Assignee" class="w-6 h-6 rounded-full" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/ac228c19857647d18c47bfb1873c898d.jpg"/>
</div>
</div>
<!-- 高优先级任务 -->
<div class="task-card bg-white p-4 rounded-3xl shadow-sm border-l-4 border-orange-400">
<div class="flex items-start space-x-3">
<button class="mt-1 w-5 h-5 border-2 border-orange-100 rounded-md flex items-center justify-center">
<div class="w-3 h-3 bg-orange-400 rounded-sm hidden"></div>
</button>
<div class="flex-1">
<div class="flex justify-between items-center">
<h4 class="font-bold text-gray-800">买晚餐食材</h4>
<span class="text-[10px] text-orange-400 font-bold bg-orange-50 px-2 py-0.5 rounded-full">高优先级</span>
</div>
<div class="flex items-center mt-2 text-[10px] text-gray-400 space-x-3">
<span class="flex items-center"><iconify-icon class="mr-1" icon="solar:alarm-bold"></iconify-icon> 今日 17:00</span>
<span class="flex items-center"><iconify-icon class="mr-1 text-green-300" icon="solar:tag-bold"></iconify-icon> 购物</span>
</div>
</div>
<div class="flex -space-x-2">
<img alt="User" class="w-6 h-6 rounded-full border border-white" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/e42f444704664749a5ee83f434d38fd0.jpg"/>
<img alt="Partner" class="w-6 h-6 rounded-full border border-white" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/7402eb56d8a84e9983dcf520b73cc2f7.jpg"/>
</div>
</div>
</div>
<!-- 普通任务 -->
<div class="task-card bg-white p-4 rounded-3xl shadow-sm border-l-4 border-gray-200">
<div class="flex items-start space-x-3">
<button class="mt-1 w-5 h-5 border-2 border-gray-100 rounded-md flex items-center justify-center">
<div class="w-3 h-3 bg-gray-400 rounded-sm hidden"></div>
</button>
<div class="flex-1">
<div class="flex justify-between items-center">
<h4 class="font-bold text-gray-800">整理旅行照片</h4>
<span class="text-[10px] text-gray-400 font-bold bg-gray-50 px-2 py-0.5 rounded-full">普通</span>
</div>
<div class="flex items-center mt-2 text-[10px] text-gray-400 space-x-3">
<span class="flex items-center"><iconify-icon class="mr-1" icon="solar:alarm-bold"></iconify-icon> 明日 20:00</span>
<span class="flex items-center"><iconify-icon class="mr-1 text-blue-300" icon="solar:tag-bold"></iconify-icon> 纪念日</span>
</div>
</div>
<img alt="Assignee" class="w-6 h-6 rounded-full" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/ac228c19857647d18c47bfb1873c898d.jpg"/>
</div>
</div>
<!-- 重复任务 -->
<div class="task-card bg-white p-4 rounded-3xl shadow-sm border-l-4 border-blue-200">
<div class="flex items-start space-x-3">
<button class="mt-1 w-5 h-5 border-2 border-blue-100 rounded-md flex items-center justify-center">
<div class="w-3 h-3 bg-blue-400 rounded-sm hidden"></div>
</button>
<div class="flex-1">
<div class="flex justify-between items-center">
<h4 class="font-bold text-gray-800">晚间护肤打卡</h4>
<span class="text-[10px] text-blue-400 font-bold bg-blue-50 px-2 py-0.5 rounded-full">🔄 每日</span>
</div>
<div class="flex items-center mt-2 text-[10px] text-gray-400 space-x-3">
<span class="flex items-center"><iconify-icon class="mr-1" icon="solar:alarm-bold"></iconify-icon> 22:00</span>
<span class="flex items-center"><iconify-icon class="mr-1 text-pink-300" icon="solar:tag-bold"></iconify-icon> 日常</span>
</div>
</div>
<img alt="Assignee" class="w-6 h-6 rounded-full" src="https://modao.cc/agent-py/media/generated_images/2026-06-26/ac228c19857647d18c47bfb1873c898d.jpg"/>
</div>
</div>
</section>
<!-- 新建按钮 -->
<div class="fixed bottom-24 right-6">
<button class="bg-[#FF8C9E] text-white px-6 py-4 rounded-full shadow-xl flex items-center space-x-2 active:scale-95 transition-transform">
<iconify-icon icon="solar:add-circle-bold" width="24"></iconify-icon>
<span class="font-bold">新建待办</span>
</button>
</div>
<!-- 底部导航栏 -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[414px] bg-white border-t border-gray-100 px-6 py-3 flex justify-between items-center z-50">
<a class="flex flex-col items-center text-gray-400" href="home.html">
<iconify-icon icon="solar:home-smile-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">首页</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="schedule.html">
<iconify-icon icon="solar:calendar-minimalistic-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">行程</span>
</a>
<a class="flex flex-col items-center text-[#FF8C9E]" href="todo.html">
<iconify-icon icon="solar:checklist-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1 font-bold">ToDo</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="album.html">
<iconify-icon icon="solar:gallery-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">相册</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="profile.html">
<iconify-icon icon="solar:user-circle-bold-duotone" width="24"></iconify-icon>
<span class="text-[10px] mt-1">我的</span>
</a>
</nav>
</div>
</body>
</html>
