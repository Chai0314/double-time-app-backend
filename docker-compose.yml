version: "3.9"

# 一键起 MySQL 8.0
# 启动：docker compose up -d
# 停止：docker compose down
# 数据卷：mysql_data（删数据卷请用 docker compose down -v）
services:
  mysql:
    image: mysql:8.0
    container_name: couple-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: couple_root_pwd
      MYSQL_DATABASE: couple_space
      MYSQL_USER: couple
      MYSQL_PASSWORD: couple_pwd
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcouple_root_pwd"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
